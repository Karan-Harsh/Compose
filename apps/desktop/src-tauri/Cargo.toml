[package]
name = "typeflow-desktop"
version = "0.1.0"
description = "TypeFlow desktop application"
authors = ["TypeFlow Contributors"]
edition = "2021"

[lib]
name = "typeflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
